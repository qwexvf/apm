version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ccpm
    main: .
    binary: ccpm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: ccpm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .Binary }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - install.sh

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: qwexvf
    name: ccpm
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
